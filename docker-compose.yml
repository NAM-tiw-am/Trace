version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: trace_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trace_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: trace_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/trace_db
      - INSIGHTFACE_MODEL=buffalo_l
      - MATCH_THRESHOLD=0.35
      - ALERT_COOLDOWN_SECONDS=5.0
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./static:/app/static
      - insightface_cache:/root/.insightface

volumes:
  pgdata:
  insightface_cache:
